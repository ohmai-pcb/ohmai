# Block 1: input connector and 3.3 V LDO, drawn like the AP2112 "Typical Applications Circuit"
# (Diodes DS39724 Rev. 2-2, p.2): CIN 1 uF at VIN, COUT 1 uF at VOUT; EN tied to VIN (always on).
title: "1 Input and 3V3 LDO (AP2112 p.2)"
paper: A4
parts:
  J1: {lib: "Connector_Generic:Conn_01x02", value: "VIN 5V", mpn: "FICT-HDR-1X02",
       fp: "Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical", nets: {"1": VIN, "2": GND}}
  U1: {lib: "Regulator_Linear:AP2112K-3.3", value: AP2112K-3.3, mpn: AP2112K-3.3TRG1,
