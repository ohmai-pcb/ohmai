[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ohmai"
dynamic = ["version"]
description = "OhmAI: idea-to-finished-PCB workflow for KiCad, run by an LLM agent with human gates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "OhmAI contributors" }]
keywords = ["kicad", "pcb", "eda", "llm", "agent", "hardware"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
# `ohmai layout` grid router, pour and DSN steps (BSD-3 numpy / shapely); the steps run in KiCad's Python,
# which needs them too. Placement checks (escape-room, layout fit) need neither.
layout = ["numpy>=1.24", "shapely>=2.0"]

[project.scripts]
ohmai = "ohmai.cli:main"

[tool.hatch.version]
path = "src/ohmai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ohmai"]

# The project template and the skill live at the repo root (one copy).
# Wheels carry them as package data; editable installs read them from the repo.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml", "hatch_build.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long table/message strings; keep code lines short by hand

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/ohmai-pcb/ohmai"
Repository = "https://github.com/ohmai-pcb/ohmai"
Issues = "https://github.com/ohmai-pcb/ohmai/issues"
