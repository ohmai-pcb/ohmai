name: release

# Builds the CLI wheel when a v* tag is pushed, checks the tag equals __version__, and keeps the wheel as a
# workflow artifact. No PyPI publishing until v0.3 (docs/ROADMAP.md); install from git at the tag meanwhile.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tag matches __version__
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('cli/src/ohmai/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: pip install build && python -m build --wheel cli -o dist   # sdist unsupported: template/ lives outside cli/
      - run: python -m zipfile -l dist/*.whl | grep -q "ohmai/_data/skill/SKILL.md"
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

